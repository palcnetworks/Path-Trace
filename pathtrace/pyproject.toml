[project]
name = "pathtrace"
version = "0.2.0"
description = "Intent-propagation tracer for the SONiC datapath (CONFIG_DB → APPL_DB → STATE_DB → ASIC_DB)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["redis>=4.0", "pyyaml>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pathtrace = "pathtrace.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pathtrace"]

[tool.setuptools.package-data]
pathtrace = ["object_types.yaml"]
